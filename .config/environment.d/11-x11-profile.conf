FZF_DEFAULT_COMMAND=rg --files --hidden --follow -g '!{node_modules/,.venv/,venv,.git/,.github,dist,android/,ios/,build/,vendor/}'
SKIM_DEFAULT_COMMAND=fd -t f || rg --files || find .
FZF_CTRL_T_COMMAND=${FZF_DEFAULT_COMMAND}
FZF_ALT_C_COMMAND=fd -t d -H -L --ignore-file ${XDG_CONFIG_HOME}/git/ignore
FZF_DEFAULT_OPTS=--cycle --reverse --marker='+' --keep-right --color=fg:#cdcdcd --color=bg:#141415 --color=hl:#f3be7c --color=fg+:#aeaed1 --color=bg+:#252530 --color=hl+:#f3be7c --color=border:#606079 --color=header:#6e94b2 --color=gutter:#141415 --color=spinner:#7fa563 --color=info:#f3be7c --color=pointer:#aeaed1 --color=marker:#d8647e --color=prompt:#bb9dbd

# The original profile appended these with existence checks and de-duplication.
# environment.d cannot check directories or de-duplicate, so keep the same
# useful order with absolute paths. Non-existent entries are harmless.
PATH=${PATH:-/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin}:${USER_HOME}/.local/bin/:${USER_HOME}/.local/bin/myscripts/:${XDG_DATA_HOME}/bob/nvim-bin:${XDG_CACHE_HOME}/fnm-install:${XDG_DATA_HOME}/npm/bin/:${XDG_DATA_HOME}/npm/lib/:${XDG_CONFIG_HOME}/suckless/dwm/status/scripts/:${USER_HOME}/.turso:${USER_HOME}/Downloads/GitClones/void-packages:${USER_HOME}/Documents/Programming/Flutter/flutter/bin:${DENO_INSTALL}/bin:${BUN_INSTALL}/bin:${ANDROID_HOME}/emulator:${ANDROID_HOME}/tools:${ANDROID_HOME}/tools/bin:${ANDROID_HOME}/cmdline-tools/latest:${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${CARGO_HOME}/bin:/home/linuxbrew/.linuxbrew/opt/ffmpeg-full/bin

