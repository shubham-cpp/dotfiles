# Converted from ~/.config/X11/profile for GNOME/GDM/systemd user sessions.
# environment.d supports KEY=VALUE, ${VAR}, ${VAR:-fallback}, ${VAR:+alternate},
# quotes, line continuations, and $$ for literal dollar signs. It does not
# support export, source, arrays, if statements, directory checks, or command
# substitution.

USER_HOME=${HOME:-/home/shubham}
XDG_CONFIG_HOME=${USER_HOME}/.config
XDG_DATA_HOME=${USER_HOME}/.local/share
XDG_STATE_HOME=${USER_HOME}/.local/state
XDG_CACHE_HOME=${USER_HOME}/.cache

