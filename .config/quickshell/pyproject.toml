[project]
name = "quickshell-checks"
version = "0.0.0"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.ruff.lint]
select = ["C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.complexipy]
paths = ["scripts", "tests"]
max-complexity-allowed = 15

[dependency-groups]
dev = [
    "complexipy>=8.0.1",
    "ruff>=0.16.7",
]
