# env=WLR_DRM_DEVICES,/dev/dri/by-path/pci-0000:05:00.0-card:/dev/dri/by-path/pci-0000:01:00.0-card
env=XCURSOR_THEME,Future-cursors
env=XCURSOR_SIZE,24

exec-once=~/.config/mango/autostart.sh

gappih=4
gappiv=4
gappoh=4
gappov=4
borderpx=2
no_border_when_single=1
# 0xRRGGBBAA
focuscolor=0xd1b7ffff
animations=0
layer_animations=1
animation_type_open=fade
animation_type_close=fade
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
view_current_to_back=1
tag_animation_direction=0
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=250
animation_duration_open=150
animation_duration_tag=220
animation_duration_close=150
animation_duration_focus=0
animation_curve_open=0.16,1,0.3,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.25,0.46,0.45,0.94
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadein=0.16,1,0.3,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
allow_lock_transparent=0

shadows = 1
layer_shadows = 1
shadow_only_floating=1
shadows_size = 12
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

# options
repeat_rate=40
repeat_delay=300
numlockon=0
trackpad_natural_scrolling=1
trackpad_accel_speed=0.45
mouse_accel_speed=0.4
# if games are lagging
# syncobj_enable=1
# Turn off silly defaults
smartgaps=1
new_is_master=1
enable_hotarea=0
warpcursor=1
sloppyfocus=1
cursor_hide_on_keypress=1
idleinhibit_when_fullscreen=1
axis_bind_apply_timeout=100
drag_tile_to_tile=1
enable_floating_snap=1
snap_distance=30
tag_carousel=1
gesture_live=1
center_master_overspread = 0
center_when_single_stack = 1
# Scroller Layout Setting
scroller_structs = 5
scroller_default_proportion = 0.50
scroller_default_proportion_single = 1.00
scroller_ignore_proportion_single = 0
scroller_focus_center = 0
scroller_prefer_center = 0
scroller_prefer_overspread = 1

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+CTRL,btn_right,killclient
# Gesturebind
gesturebind=none,left,3,focusstack,prev
gesturebind=none,right,3,focusstack,next
gesturebind=none,up,3,viewtoright_have_client
gesturebind=none,down,3,viewtoleft_have_client
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

# Layouts in mango are per tag.
tagrule=id:*,layout_name:scroller
tagrule=id:0,layout_name:scroller,open_as_floating:1

# Layouts
bind=SUPER,       t, spawn_shell,          ~/.config/mango/scripts/toggle_layout.sh tile
bind=SUPER+SHIFT, t, spawn_shell,          ~/.config/mango/scripts/toggle_layout.sh vertical_tile
bind=SUPER+SHIFT, f, togglefullscreen,
bind=SUPER,       s, togglefloating,
bind=SUPER,       f, spawn_shell,          ~/.config/mango/scripts/toggle_proportion.sh
bind=SUPER+SHIFT, m, togglemaximizescreen, 0
bind=SUPER,       v, spawn_shell,          ~/.config/mango/scripts/toggle_layout.sh deck
bind=SUPER+SHIFT, v, spawn_shell,          ~/.config/mango/scripts/toggle_layout.sh vertical_deck
bind=SUPER,       g, spawn_shell,          ~/.config/mango/scripts/toggle_layout.sh grid
bind=SUPER+SHIFT, g, spawn_shell,          ~/.config/mango/scripts/toggle_layout.sh vertical_grid
bind=SUPER,       x, spawn_shell,          ~/.config/mango/scripts/toggle_layout.sh scroller
bind=SUPER+SHIFT, x, spawn_shell,          ~/.config/mango/scripts/toggle_layout.sh vertical_scroller
bind=SUPER,       a, togglegaps
bind=SUPER+SHIFT, a, toggleglobal
bind=SUPER+SHIFT, o, toggleoverlay

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

bind=SUPER,0,toggleoverview
bind=SUPER,Tab,view,-1
bind=SUPER,o,togglejump
bind=ALT,Tab,switcher,all_tag_next
bind=SUPER+SHIFT,0,toggle_special_tag
bind=SUPER+CTRL,0,tag_special_tag
bind=SUPER+ALT,0,tag_special_silent

# bind=SUPER+SHIFT,R,setkeymode,resize
# keymode=resize
# bind=NONE,Left,resizewin,-10,0
# bind=NONE,Right,resizewin,+10,0
# bind=NONE,Escape,setkeymode,default
bind=SUPER,Up,resizewin,+0,-10
bind=SUPER,Down,resizewin,+0,+10
bind=SUPER,Left,resizewin,-10,+0
bind=SUPER,Right,resizewin,+10,+0
# bind=SUPER,tab,focusstack,next

# switch window focus
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right

# swap window
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# window groups
bind=SUPER+CTRL,h,groupjoin,left
bind=SUPER+CTRL,l,groupjoin,right
bind=SUPER+CTRL,k,groupjoin,up
bind=SUPER+CTRL,j,groupjoin,down
bind=SUPER+CTRL,n,groupfocus,next
bind=SUPER+CTRL,p,groupfocus,prev
bind=SUPER+CTRL,g,groupleave

# smartmovewin
# bind=CTRL+SHIFT,k,smartmovewin,up
# bind=CTRL+SHIFT,j,smartmovewin,down
# bind=CTRL+SHIFT,h,smartmovewin,left
# bind=CTRL+SHIFT,l,smartmovewin,right

bind=SUPER+SHIFT,q,killclient
bind=SUPER+CTRL,r,reload_config
bind=SUPER+CTRL,x,quit

bind=SUPER,bracketleft,viewtoleft,0
bind=SUPER,bracketright,viewtoright,0
bind=SUPER+SHIFT,bracketleft,tagtoleft,0
bind=SUPER+SHIFT,bracketright,tagtoright,0
bind=SUPER,grave,viewtoright_have_client,0
bind=SUPER+SHIFT,grave,viewtoleft_have_client,0

bind=SUPER,Return,spawn,foot
bind=SUPER+SHIFT,Return,spawn,kitty

# bind=SUPER,d,spawn,fuzzel
bind=SUPER,d,spawn,qs ipc call launcher toggle
bind=SUPER+SHIFT,d,spawn,rofi -show run -config ~/.config/rofi/dmenu.rasi
bind=NONE,XF86Search, spawn, vicinae vicinae://open?popToRoot=true
bind=ALT,SPACE, spawn, vicinae vicinae://open?popToRoot=true

bindl=NONE,    XF86AudioRaiseVolume,  spawn, ~/.local/bin/myscripts/audio inc
bindl=NONE,    XF86AudioLowerVolume,  spawn, ~/.local/bin/myscripts/audio dec
bindl=NONE,    XF86AudioMute,         spawn, ~/.local/bin/myscripts/audio toggle
bindl=CTRL,    F5,                    spawn, ~/.local/bin/myscripts/audio toggle-mic
bindl=NONE,    XF86AudioPlay,         spawn_shell, playerctl play-pause
bindl=NONE,    XF86AudioPause,        spawn_shell, playerctl play-pause
bindl=NONE,    XF86AudioPrev,         spawn_shell, playerctl previous
bindl=NONE,    XF86AudioNext,         spawn_shell, playerctl next
bindl=NONE,    XF86MonBrightnessUp,   spawn, qs ipc call brightness adjust 10
bindl=NONE,    XF86MonBrightnessDown, spawn, qs ipc call brightness adjust -10
bindl=NONE,    XF86Calculator,        toggle_named_scratchpad, qalculate-gtk, none, qalculate-gtk

bind=NONE, Print, spawn_shell, grim -t ppm -g "$(slurp)" - | ~/.local/bin/satty --filename - --floating-hack
bind=SHIFT,Print, spawn, ~/.local/bin/myscripts/screenshot screen
bind=ALT,Print, spawn, ~/.local/bin/myscripts/screenshot window
bind=SUPER,Print, spawn, ~/.local/bin/myscripts/ocr-ss-text

bind=SUPER+CTRL,s,spawn,~/.local/bin/myscripts/logout_prompt
bind=SUPER+CTRL,l,spawn,qs ipc call lock activate

bind=SUPER,       e, spawn_shell, thunar || nautilus || notify-send -u critical "Program not installed" "file manager"
bind=SUPER+SHIFT, e, toggle_named_scratchpad, foot-yazi, none, foot -a foot-yazi -e yazi

bind=SUPER,       w, spawn,       gtk-launch helium
bind=SUPER+SHIFT, w, spawn_shell, gtk-launch io.gitlab.LibreWolf.desktop || gtk-launch com.brave.Browser.desktop || gtk-launch brave-browser.desktop

bind=SUPER,    y, spawn, qs ipc call clipboard toggle
# bind=SUPER+SHIFT, p, spawn_shell, ~/.local/bin/myscripts/superp
bind=SUPER+SHIFT, p, spawn, qs ipc call files toggle
bind=SUPER,    p, switcher,next
bind=ALT+CTRL, e, spawn, qs ipc call emoji toggle
bind=ALT+CTRL, v, toggle_named_scratchpad, org.pulseaudio.pavucontrol, none, pavucontrol
bind=ALT+CTRL, b, toggle_named_scratchpad, blueman-manager, none, blueman-manager
bind=ALT+CTRL, t, toggle_named_scratchpad, foot-btop, none, foot -a foot-btop -e btop
bind=ALT+CTRL, n, toggle_named_scratchpad, foot-nmtui, none, foot -a foot-nmtui -e nmtui
bind=ALT+CTRL, c, spawn_shell, hyprpicker -a || notify-send -u critical "Program not Installed" "hyprpicker is not installed"

bind=SUPER+SHIFT, z, spawn_shell, ~/.local/bin/wooz --zoom-in 80% --mouse-track --invert-scroll --map-close q

bind=CTRL+ALT, s,     spawn_shell, pkill -USR2 -n handy
bind=SUPER,   period, spawn_shell, ~/.local/bin/nvstt toggle
bind=NONE,    F8,     spawn_shell, ~/.local/bin/nvstt toggle

windowrule=width:0.14,height:0.33,isfloating:1,isglobal:1,offsetx:70,offsety:50,title:Meet –
windowrule=width:500,height:300,isfloating:1,appid:org.kde.dolphin,title:Progress Dialog — Dolphin
windowrule=width:500,height:300,isfloating:1,appid:org.kde.dolphin,title:Copying — Dolphin
windowrule=width:500,height:400,isfloating:1,title:About Mozilla Firefox
windowrule=width:0.42,height:0.42,isfloating:1,isglobal:1,isopensilent:1,istagsilent:1,offsetx:55,offsety:35,title:Picture-in-[Pp]icture
windowrule=width:700,height:500,isnamedscratchpad:1,appid:org.pulseaudio.pavucontrol
windowrule=width:500,height:400,isnamedscratchpad:1,appid:blueman-manager
windowrule=width:500,height:400,isfloating:1,appid:nm-applet
windowrule=width:500,height:400,isfloating:1,appid:nm-connection-editor
windowrule=width:500,height:400,isfloating:1,shield_when_capture:1,appid:chrome-nngceckbapebfimnlniiiahkandclblb-Default
windowrule=width:500,height:400,isfloating:1,shield_when_capture:1,title:^(.*Bitwarden Password Manager.*)$
windowrule=shield_when_capture:1,appid:com.bitwarden.desktop
windowrule=shield_when_capture:1,appid:org.keepassxc.KeePassXC
windowrule=shield_when_capture:1,appid:org.gnome.World.Secrets
windowrule=width:1200,height:800,isfloating:1,appid:should_be_floating
windowrule=width:400,height:200,isfloating:1,appid:org.kde.polkit-kde-authentication-agent-1
windowrule=width:700,height:500,isfloating:1,shield_when_capture:1,title:clipboard-cliphist
windowrule=width:400,height:500,isnamedscratchpad:1,appid:qalculate-gtk
windowrule=width:1000,height:700,isnamedscratchpad:1,appid:foot-btop
windowrule=width:1000,height:700,isnamedscratchpad:1,appid:foot-nmtui
windowrule=width:1000,height:700,isnamedscratchpad:1,appid:foot-yazi
windowrule=tags:2,appid:^(firefox|librewolf|helium|brave-browser|io.github.ungoogled_software.ungoogled_chromium)$
windowrule=confine_pointer:1,appid:^steam_app_
windowrule=appid:Handy,title:Recording,isopensilent:1,isfloating:1
windowrule=appid:org.gnome.FileRoller,title:Extract,isopensilent:1,isfloating:1
windowrule=title:AppImage Installer,isfloating:1
windowrule=width:700,height:500,title:Select a source to share,isfloating:1

layerrule=noanim:1,noblur:1,noshadow:1,layer_name:selection
